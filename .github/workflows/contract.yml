name: contract

on:
  push:
  pull_request:

jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enforce fixture provenance
        run: python3 tools/check_provenance.py
      - name: Enforce secrecy invariant (spec/auth.md AUTH-5)
        run: python3 tools/check_secrecy.py
      - name: Audit corpus (orphan ratchet, volatile lint, burn-down reports)
        run: python3 tools/audit.py
      - name: Spec drift (reflected surface must be covered by spec/)
        # Skips itself with a notice when lm15-python is not checked out as
        # a sibling (same convention as the python2 vet smoke test); full
        # teeth locally and in any cross-repo checkout.
        run: python3 tools/spec_drift.py
      - name: Mutation self-test (the comparator must catch every injected mutation)
        run: python3 harness/selftest.py
