name: contract

on:
  push:
  pull_request:

jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enforce fixture provenance
        run: python3 tools/check_provenance.py
      - name: Audit corpus (orphan ratchet, volatile lint, burn-down reports)
        run: python3 tools/audit.py
