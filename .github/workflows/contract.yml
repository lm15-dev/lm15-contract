name: contract

on:
  push:
  pull_request:

jobs:
  provenance:
    runs-on: ubuntu-latest
    # Text I/O must name its encoding: the default is not UTF-8 on Windows
    # (2026-09-24). Any implicit one is an error in every step.
    env:
      PYTHONWARNDEFAULTENCODING: "1"
      PYTHONWARNINGS: "error::EncodingWarning"
    defaults:
      run:
        working-directory: lm15-contract
    steps:
      - uses: actions/checkout@v4
        with:
          path: lm15-contract
      - uses: actions/checkout@v4
        with:
          repository: lm15-dev/lm15-python
          # Reflection source, not the contract oracle. Pin for reproducible checks.
          ref: 1ae98203f643059f0c103933c80ab0e7f68c5f26
          path: lm15-python
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare stdlib-only reference shim
        run: python3 -m venv ../lm15-python/.venv
      - name: Paths every OS can store (a Windows clone must work)
        run: python3 tools/check_portable_paths.py
      - name: Enforce fixture provenance
        run: python3 tools/check_provenance.py
      - name: Enforce secrecy invariant (spec/auth.md AUTH-5)
        run: python3 tools/check_secrecy.py
      - name: Audit corpus (orphan ratchet, volatile lint, burn-down reports)
        run: python3 tools/audit.py --require-reference
      - name: Spec drift (reflected surface must be covered by spec/)
        env:
          LM15_SPEC_DRIFT_STRICT: "1"
        run: python3 tools/spec_drift.py
      - name: "Content coverage (MAP-10: every binding pins its tool-result media cell or declares it open)"
        run: python3 tools/check_content_coverage.py
      - name: Every kind a pinned stream carries is decided (MAP-20)
        run: python3 tools/check_stream_events.py
      - name: Gateway capture record (schema, example day, blob and redaction invariants)
        run: python3 tools/check_gateway.py
      - name: Provider landscape (Pi and LiteLLM providers classified against the support matrix; report current)
        run: python3 tools/provider_landscape.py check
      - name: Offline tooling regressions
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Mutation self-test (the comparator must catch every injected mutation)
        run: python3 harness/selftest.py
